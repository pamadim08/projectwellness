spring.application.name=wellness

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP Connection Pool Settings (High Concurrency & Low Latency)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2


# Supabase Storage Settings
supabase.url=https://csljpnypebwjgvoygqov.supabase.co
supabase.key=sb_publishable_iPzf-LZQfAiXoWK-HRfpMg_P7WHBfPS
supabase.bucket=WELLNESS-IMAGES

# Server Port
server.port=8080

# Mail Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Import Secret Properties (Datasource & Credentials)
spring.config.import=optional:classpath:application-secret.properties

# Session Management (Idle Timeout 30 minutes)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true